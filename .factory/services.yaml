commands:
  install: ./.factory/init.sh
  typecheck: if [ -f Cargo.toml ] || [ -f rust-ag/Cargo.toml ]; then cargo check --workspace; else echo "No Rust workspace yet; skipping typecheck"; fi
  build: ./build.sh && if [ -f Cargo.toml ] || [ -f rust-ag/Cargo.toml ]; then cargo build --workspace --release; else echo "No Rust workspace yet; skipping Rust build"; fi
  test: PATH=".venv-ag-tests/bin:$PATH" make test && if [ -f Cargo.toml ] || [ -f rust-ag/Cargo.toml ]; then cargo test --workspace -- --test-threads=5; else echo "No Rust workspace yet; skipping Rust tests"; fi
  lint: if [ -f Cargo.toml ] || [ -f rust-ag/Cargo.toml ]; then cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings; else echo "No Rust workspace yet; skipping Rust lint"; fi
  parity_baseline_smoke: python3 scripts/parity/run_matrix.py --target baseline --group smoke
  parity_edge_cases_baseline: python3 scripts/parity/run_matrix.py --target baseline --group edge-cases
  parity_core_ignore_recursion_rust: python3 scripts/parity/run_matrix.py --target rust --group core-ignore-recursion
  parity_core_matching_rust: python3 scripts/parity/run_matrix.py --target rust --group core-matching
  parity_validate_latest: python3 scripts/parity/validate_outputs.py --run latest
  parity_validate_fixture_integrity: python3 scripts/parity/validate_fixture_integrity.py
  parity_build_fixture_manifest_verify: python3 scripts/parity/build_fixture_manifest.py --verify
  parity_build_scenario_manifest_verify: python3 scripts/bench/build_scenario_manifest.py --verify
  edge_fixtures_setup_verify: python3 tests/edge-cases/setup_fixtures.py --verify
  benchmark_smoke: python3 benchmarks/harness.py smoke --comparators rust ag rg ugrep
  benchmark_validate_latest: python3 benchmarks/validate_manifest.py --run latest
  benchmark_tests: python3 -m pytest benchmarks/tests/test_manifest_integrity.py -v
  publication_gate: python3 publication/check_claims.py --memo publication/ragas_blog_memo.md

services: {}
